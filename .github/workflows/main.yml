name: Update Deployment Manifest

on:
  repository_dispatch:
    types: [deploy]

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Deployment Manifests Repo
      - name: Checkout Deployment Repo
        uses: actions/checkout@v4

      # 2️⃣ Update frontend-deployment.yaml with new tag from payload
      - name: Update Image Tag
        run: |
          IMAGE_TAG="${{ github.event.client_payload.image_tag }}"
          echo "Updating frontend deployment to image tag: $IMAGE_TAG"

          # Replace frontend image tag in YAML
          sed -i 's|image: .*/frontend:.*|image: arunkumar885/frontend:'"${IMAGE_TAG}"'|g' frontend-deployment.yaml

      # 3️⃣ Commit and Push updated YAML to Deployment Repo
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend-deployment.yaml
          git commit -m "ci: update frontend image tag to ${{ github.event.client_payload.image_tag }}" || echo "No changes to commit"
          git push
