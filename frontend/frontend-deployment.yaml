apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: arunkumar885/frontend:test-v1.0.20
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "30Mi"
            limits:
              cpu: "500m"
              memory: "80Mi"
          ports:
            - containerPort: 80
          readinessProbe: # Fixed: capital P
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10 # Fixed: lowercase p
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20 # Fixed: lowercase p
---
# Fixed: Added YAML document separator
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: project
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
